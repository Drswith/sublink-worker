<div x-data="updateChecker(&#39;{{ version }}&#39;, &#39;https://api.github.com/repos/7Sageer/sublink-worker/releases/latest&#39;)" x-show="showUpdateToast" x-cloak="true" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-2" class="fixed bottom-6 right-6 z-50 max-w-sm">
  <div class="bg-white dark:bg-gray-800/95 backdrop-blur-md border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg p-4 ring-1 ring-black/5">
    <div class="flex items-start gap-3">
      <div class="flex-shrink-0 pt-0.5">
        <i class="fas fa-arrow-up text-primary-500"></i>
      </div>
      <div class="flex-1 min-w-0">
        <h4 class="text-sm font-medium text-gray-900 dark:text-gray-100 flex items-center gap-2">
          <span x-text="i18n.newVersionAvailable || &#39;New Version Available&#39;"></span>
          <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-primary-50 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400 border border-primary-100 dark:border-primary-800" x-text="&#39;v&#39; + latestVersion"></span>
        </h4>
        <div class="mt-3 flex items-center gap-3 flex-wrap">
          <a href="https://github.com/7Sageer/sublink-worker/releases/latest" target="_blank" rel="noopener noreferrer" class="text-xs font-medium text-primary-600 dark:text-primary-400 hover:text-primary-700 dark:hover:text-primary-300 transition-colors">
            <span x-text="i18n.viewRelease || &#39;View Release&#39;"></span>
          </a>
          <div class="w-px h-3 bg-gray-200 dark:bg-gray-700"></div>
          <button x-on:click="dismissUpdate()" class="text-xs font-medium text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-colors">
            <span x-text="i18n.later || &#39;Later&#39;"></span>
          </button>
          <div class="w-px h-3 bg-gray-200 dark:bg-gray-700"></div>
          <a href="https://sublink.works/guide/faq#使用-vercel-cloudflare-快速部署按钮后-如何同步上游更新" target="_blank" rel="noopener noreferrer" class="text-xs font-medium text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 transition-colors flex items-center gap-1">
            <i class="fas fa-book text-xs"></i>
            <span x-text="i18n.updateGuide || &#39;Update Guide&#39;"></span>
          </a>
        </div>
      </div>
      <button x-on:click="dismissUpdate()" class="flex-shrink-0 text-gray-400 hover:text-gray-500 dark:hover:text-gray-300 transition-colors" aria-label="Close">
        <i class="fas fa-times text-xs"></i>
      </button>
    </div>
  </div>
</div>
