services:
  worker:
    image: ${SUBLINK_WORKER_IMAGE:-ghcr.io/drswith/sublink-worker:latest}
    pull_policy: always
    ports:
      - "38471:38471"
    environment:
      # Set to 0 to keep stored configs without automatic expiration.
      CONFIG_TTL_SECONDS: 2592000
    volumes:
      - sublink-data:/data
    restart: unless-stopped
volumes:
  sublink-data:
